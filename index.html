<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="main.css" />
    <title>Quiz App</title>
  </head>
  <body>
   <body>
  <div class="container">

    <!-- START SCREEN -->
    <div class="screen active" id="start-screen">
      <h1>Quiz Time</h1>
      <p>Test Your Knowledge with these fun questions!</p>
      <button id="start-btn">Start Quiz</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div class="screen" id="quiz-screen">
      <div id="quiz-header">
        <h2 id="question-text">Questions goes here</h2>
        <div class="quiz-info">
          <p>
            Question <span id="current-question">1</span> of
            <span id="total-questions">5</span>
          </p>
          <p>Score: <span id="score">0</span></p>
        </div>
      </div>

      <div id="answers-container" class="answers-container">
        <!-- Answer buttons will be generated here from our JavaScript code -->
      </div>

      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>
    </div> <!-- closes quiz-screen -->

    <!-- RESULT SCREEN (sibling of the others, no "active") -->
    <div class="screen" id="result-screen">
      <h1>Quiz Results!</h1>
      <div class="result-info">
        <p>
          You scored <span id="final-score">0</span> out of
          <span id="max-score">5</span>
        </p>
        <div id="result-message">Good job!</div>
      </div>
      <button id="restart-btn">Restart Quiz</button>
    </div> <!-- closes result-screen -->

  </div> <!-- closes container -->

  <script src="script.js"></script>
    
  </body>
</html>
